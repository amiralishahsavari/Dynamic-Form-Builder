{% extends "../base/base.html" %}
{% load static %}

{% block content %}
<div class="container d-flex justify-content-center align-items-start" style="min-height: 30vh; padding-top: 30px;">
  <div class="card shadow-lg border-0 rounded-4" style="width: 100%; max-width: 520px; background-color: #f8f9fa;">
    
    <!-- هدر با گرادیانت آبی و ارتفاع بیشتر -->
    <div class="card-header text-white text-center rounded-top-4 d-flex flex-column justify-content-center"
         style="background: linear-gradient(135deg, #0d6efd, #0a58ca); height: 120px;">
      <h3 class="fw-bold mb-0">ورود به حساب کاربری</h3>
      <small class="text-light mt-1">خوش آمدید</small>
    </div>

    <div class="card-body p-4">

      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-danger border border-danger-subtle bg-danger-subtle text-danger-emphasis rounded-3 py-2 px-3 mb-3" role="alert">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}


      <form method="POST" class="needs-validation" novalidate>
        {% csrf_token %}

        <div class="form-group mb-3">
          <label class="form-label">نام کاربری:</label>
          <input type="text" name="username" class="form-control form-control-lg" 
                 placeholder="نام کاربری خود را وارد کنید" required>
        </div>

        <div class="form-group mb-4">
          <label class="form-label">رمز عبور:</label>
          <input type="password" name="password" class="form-control form-control-lg"
                 placeholder="رمز عبور خود را وارد کنید" required >
        </div>

        <!-- دکمه ورود -->
        <div class="d-grid">
          <button type="submit" class="btn btn-lg text-white fw-semibold d-flex align-items-center justify-content-center gap-2"
                  style="background: linear-gradient(135deg, #0d6efd, #0a58ca); box-shadow: 0 0 15px rgba(0,0,0,0.2); border: none;">
            <i class="fa fa-sign-in-alt"></i> <span style="position: relative; top: -3px;">ورود</span>
          </button>
        </div>
      </form>

      <div class="mt-4 text-center">
        <p class="small text-muted">حساب کاربری ندارید؟
          <a href="{% url 'register' %}" class="fw-bold text-decoration-none text-primary">ثبت‌نام کنید</a>
        </p>
      </div>
    </div>

  </div>
</div>
{% endblock %}
