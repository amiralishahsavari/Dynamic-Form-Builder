{% extends "../base/base.html" %}

{% block content %}
<div class="container d-flex justify-content-center align-items-start" style="min-height: 30vh; padding-top: 30px;">
  <div class="card shadow-lg border-0 rounded-4" style="width: 100%; max-width: 520px; background-color: #f8f9fa;">
    
    <!-- هدر با گرادیانت آبی -->
    <div class="card-header text-white text-center rounded-top-4 d-flex flex-column justify-content-center"
         style="background: linear-gradient(135deg, #0d6efd, #0a58ca); height: 120px;">
      <h3 class="fw-bold mb-0">تغییر رمز عبور موفقیت‌آمیز بود</h3>
      <small class="text-light mt-1">رمز شما با موفقیت به‌روزرسانی شد</small>
    </div>

    <div class="card-body p-4 text-center">
      <i class="fa fa-check-circle text-success" style="font-size: 48px;"></i>
      <p class="mt-3 mb-4 fs-5 fw-semibold text-success">رمز عبور شما با موفقیت تغییر کرد.</p>
      <a href="{% url 'home' %}" class="btn btn-outline-primary rounded-pill px-4 fw-bold">
        بازگشت به صفحه اصلی
      </a>
    </div>

  </div>
</div>
{% endblock %}
