{% extends "../base/base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container d-flex justify-content-center align-items-start" style="min-height: 30vh; padding-top: 30px;">
  <div class="card shadow-lg border-0 rounded-4" style="width: 100%; max-width: 520px; background-color: #f8f9fa;">
    
    <!-- هدر با گرادیانت آبی -->
    <div class="card-header text-white text-center rounded-top-4 d-flex flex-column justify-content-center"
         style="background: linear-gradient(135deg, #0d6efd, #0a58ca); height: 120px;">
      <h3 class="fw-bold mb-0">تغییر رمز عبور</h3>
      <small class="text-light mt-1">خوش آمدید</small>
    </div>

    <div class="card-body p-4">
    <form method="post" novalidate>
        {% csrf_token %}
        {{ form|crispy }}

            <div class="d-grid">
                <button type="submit" class="btn btn-lg text-white fw-semibold d-flex align-items-center justify-content-center gap-2"
                        style="background: linear-gradient(135deg, #0d6efd, #0a58ca); box-shadow: 0 0 15px rgba(0,0,0,0.2); border: none;">
                    <i class="fa fa-key"></i> <span style="position: relative; top: -3px;">تغییر رمز عبور</span>
                </button>
            </div>
        </form>
</div>
{% endblock %}
