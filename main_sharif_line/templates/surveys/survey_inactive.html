{% extends 'base/base.html' %}
{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card shadow-lg border-0" style="max-width: 500px; width: 100%; border-radius: 1rem;">
        <div class="card-body text-center p-5">
            <div class="mb-4" style="font-size: 3rem; color: #dc3545;">
                <i class="bi bi-exclamation-triangle-fill"></i>
            </div>
            <h2 class="fw-bold mb-3 text-danger">نظرسنجی غیرفعال است</h2>
            <p class="mb-2 text-muted" style="font-size: 1.1rem;">
                <span class="badge bg-secondary px-3 py-2" style="font-size: 0.95rem;">
                    {{ survey.title }}
                </span>
            </p>
            <p class="mt-3 text-secondary" style="line-height: 1.8;">
                متاسفانه این نظرسنجی در حال حاضر غیرفعال است و امکان شرکت در آن وجود ندارد.
            </p>
            <a href="/" class="btn btn-outline-danger mt-4 px-4 py-2" style="border-radius: 0.5rem;">
                بازگشت به صفحه اصلی
            </a>
        </div>
    </div>
</div>
{% endblock %}
