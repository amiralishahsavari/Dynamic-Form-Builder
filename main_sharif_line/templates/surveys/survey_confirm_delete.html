{% extends 'base/base.html' %}
{% load static %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-danger shadow-lg">
                <div class="card-header bg-danger text-white d-flex justify-content-center">
                    <i class="fas fa-exclamation-triangle fa-2x me-3"></i>
                    <h3 class="mb-0">حذف نظرسنجی "{{ object.title }}"</h3>
                </div>
                
                <div class="card-body">
                    <div class="alert alert-danger d-flex align-items-center">
                        <i class="fas fa-exclamation-circle fa-2x me-3"></i>
                        <div>
                            <h4 class="alert-heading">هشدار! این عمل غیرقابل برگشت است</h4>
                            <p class="mb-0">
                                آیا مطمئن هستید که می‌خواهید این نظرسنجی را حذف کنید؟ تمام سوالات، پاسخ‌ها و داده‌های مرتبط با آن نیز حذف خواهند شد.
                            </p>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ cancel_url }}" class="btn btn-outline-secondary btn-lg">
                            <i class="fas fa-times me-2"></i> انصراف
                        </a>                        
                        <form method="post">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger btn-lg">
                                <i class="fas fa-trash-alt me-2"></i> بله، حذف شود
                            </button>
                        </form>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .card {
        border-radius: 15px;
        overflow: hidden;
    }
    .card-header {
        border-radius: 15px 15px 0 0 !important;
    }
    .alert {
        border-radius: 10px;
    }
</style>
{% endblock %}
